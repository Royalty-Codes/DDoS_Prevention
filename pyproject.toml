[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-ddos-lab"
version = "0.1.0"
description = "Measured Mininet/OVS/Ryu telemetry capture for an SDN DDoS research lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=15.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
controller = [
  "eventlet<0.37",
  "ryu==4.34",
]
notebook = [
  "nbformat>=5.9",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
sdn-ddos = "sdn_ddos.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
